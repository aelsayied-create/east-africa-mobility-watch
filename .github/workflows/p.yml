name: sudan probe
on: { push: { branches: [sudan-probe] } }
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install openpyxl && python probe.py
      - run: git config user.name bot && git config user.email bot@users.noreply.github.com && git add out && git commit -m results && git push
