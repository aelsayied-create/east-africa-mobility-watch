name: Probe data sources
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/probe.py
      - run: |
          git config user.name "probe-bot"; git config user.email "probe@users.noreply.github.com"
          git add probe && git commit -m "probe results" && git push
